<body>
  <main id="app">

    <header>
      <div class="brand"><div class="moon" aria-hidden="true">☾</div><div class="brand-copy"><p id="brand-name">Blood on the Clocktower</p><h1 class="visually-hidden" id="page-heading">Blood on the Clocktower · Trouble Brewing</h1><div class="dropdown edition-picker"><button id="edition-trigger" class="edition-trigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="edition-menu"><span id="edition-name">Trouble Brewing</span><i data-lucide="chevron-down" aria-hidden="true"></i></button><div id="edition-menu" class="dropdown-menu edition-menu" role="menu"></div></div></div></div>

      </div>

    </div>

  </main>
